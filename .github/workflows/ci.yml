name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: honshuwheel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/honshuwheel_test?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/honshuwheel_test?schema=public
      AUTH_SECRET: ci-secret
      REAL_MONEY_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npx next typegen && npx tsc --noEmit
      - run: printf 'DATABASE_URL="%s"\nDIRECT_DATABASE_URL="%s"\nAUTH_SECRET="ci-secret"\nREAL_MONEY_ENABLED="false"\n' "$DATABASE_URL" "$DATABASE_URL" > .env.test
      - run: npm test
      - run: npm run build
        env:
          AUTH_URL: http://localhost:3000
